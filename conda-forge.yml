build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
  osx_64: osx_64
  osx_arm64: osx_64
  win_64: linux_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
os_version:
  # necessary due to glibc constraints for cross-compiling riscv
  linux_64: alma10
test: native_and_emulated
workflow_settings:
  # "quick" matches the deprecated `azure.free_disk_space: true`
  # (cleans apt and cache)
  free_disk_space: quick
  store_build_artifacts: true
