        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
      run:
        - if: osx
          then: _openmp_mutex
          else: ${{ pin_subpackage("_openmp_mutex", upper_bound=None) }}
      run_constraints:
        - if: not osx
