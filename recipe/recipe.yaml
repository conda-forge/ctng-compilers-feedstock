    requirements:
      host:
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, exact=True) }}
        - if: not cross_target_osx
          then: binutils_impl_${{ cross_target_platform }} ${{ binutils_version }}.* bootstrap_*
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
      run:
        - gcc_impl_${{ cross_target_platform }} >=${{ gcc_version }}
        - if: target_platform == cross_target_platform
          then:
            - ${{ pin_subpackage("libgfortran" ~ libgfortran_soname, upper_bound=None) }}
            - ${{ pin_subpackage("libgcc", upper_bound=None) }}
            - if: cross_target_cxx_stdlib == "libstdcxx"
              then: ${{ pin_subpackage("libstdcxx", upper_bound=None) }}
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }}
      run_exports:
        strong:
          - libgfortran${{ libgfortran_soname }} ${{ gcc_version }}.*
          - libgcc >=${{ gcc_version }}
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    tests:
      - package_contents:
          bin:
            - ${{ TARGET }}-gfortran
          files:
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgfortran.a"
            - if: cross_target_win
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgfortran.dll.a"
            - if: cross_target_osx
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgfortran.dylib"
            - if: cross_target_linux
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgfortran.so"
      - files:
          recipe:
            - tests/fortomp/**
        requirements:
          run:
            - if: x86_64 or aarch64 or ppc64le
              then: cmake >=3.11,<4
            - if: cross_target_stdlib != "None"
              then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
        script:
          - find $PREFIX/lib -iname omp_lib.mod | grep '.'
          - find $PREFIX/lib -iname omp_lib.h | grep '.'
          - find $PREFIX/lib -iname ISO_Fortran_binding.h | grep '.'
          - echo ${{ gcc_maj_ver }}
          - pushd tests/fortomp
          - if: target_platform == cross_target_platform and (x86_64 or aarch64 or ppc64le)
            then: sh test_fort.sh
    about:
      summary: GNU Fortran Compiler
      homepage: https://gcc.gnu.org/
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: gfortran
    inherit: gcc-compilers-build
    build:
      skip:
