schema_version: 1

context:
  version: ${{ gcc_version }}
  build_num: 19
  cross_target_linux: ${{ cross_target_platform in ("linux-64", "linux-aarch64", "linux-ppc64le", "linux-riscv64") }}
  cross_target_osx: ${{ cross_target_platform in ("osx-64", "osx-arm64") }}
  cross_target_win: ${{ cross_target_platform == "win-64" }}
  libgcc_devel_build_num: ${{ build_num + 100 if target_platform == cross_target_platform else build_num }}
  invalid_configuration: ${{ (win and not cross_target_win) or ((cross_target_osx or osx) and match(gcc_maj_ver, "<15")) or ((cross_target_platform == "linux-riscv64" or riscv64) and match(gcc_maj_ver, "<15")) }}
  # first component of libgomp_ver (which the shell scripts derive as
  # ${libgomp_ver:0:1}); keep in sync with conda_build_config.yaml
  libgomp_soname: 1
  path_prefix: ${{ "Library/" if win else "" }}

recipe:
  name: gcc_compilers
  version: ${{ version }}

source:
  - url: https://mirrors.ocf.berkeley.edu/gnu/gcc/gcc-${{ version }}/gcc-${{ version }}.tar.gz
    sha256: ${{ "7294d65cc1a0558cb815af0ca8c7763d86f7a31199794ede3f630c0d1b0a5723" if gcc_version == "15.2.0" else "ace8b8b0dbfe6abfc22f821cb093e195aa5498b7ccf7cd23e4424b9f14afed22" if gcc_version == "14.3.0" else "bf0baf3e570c9c74c17c8201f0196c6924b4bd98c90e69d6b2ac0cd823f33bbc" }}
    patches:
      - patches/0001-allow-commands-in-main-specfile.patch
      - if: gcc_maj_ver != "13"
        then: patches/0002-patch-zoneinfo_dir_override-to-point-to-our-tzdata.patch
      - if: cross_target_linux
        then:
          - if: gcc_maj_ver != "13"
            then: patches/0003-add-ldl-to-libstdc___la_LDFLAGS.patch
          - patches/0004-Hardcode-HAVE_ALIGNED_ALLOC-1-in-libstdc-v3-configur.patch
      # For GCC 15: https://github.com/msys2/MINGW-packages/tree/f59921184b35858d4ceb91679578de0d62475cbf/mingw-w64-gcc
      # For GCC 14: https://github.com/msys2/MINGW-packages/tree/331bf945d21af562d228ed46bda21c8272d1e76e/mingw-w64-gcc
      # For GCC 13: https://github.com/msys2/MINGW-packages/tree/4f1262b4e1072632eccf0958764f90d890b832ac/mingw-w64-gcc
      - if: cross_target_win
        then:
          - if: gcc_maj_ver == "13"
            then: patches/mingw/${{ gcc_maj_ver }}/0002-Relocate-libintl.patch
          - patches/mingw/${{ gcc_maj_ver }}/0003-Windows-Follow-Posix-dir-exists-semantics-more-close.patch
          - patches/mingw/${{ gcc_maj_ver }}/0005-Windows-Don-t-ignore-native-system-header-dir.patch
          - if: gcc_maj_ver == "13"
            then: patches/mingw/${{ gcc_maj_ver }}/0006-Windows-New-feature-to-allow-overriding.patch
          - patches/mingw/${{ gcc_maj_ver }}/0007-Build-EXTRA_GNATTOOLS-for-Ada.patch
          - patches/mingw/${{ gcc_maj_ver }}/0008-Prettify-linking-no-undefined.patch
          - patches/mingw/${{ gcc_maj_ver }}/0011-Enable-shared-gnat-implib.patch
          - patches/mingw/${{ gcc_maj_ver }}/0012-Handle-spaces-in-path-for-default-manifest.patch
          - patches/mingw/${{ gcc_maj_ver }}/0014-gcc-9-branch-clone_function_name_1-Retain-any-stdcall-suffix.patch
          - patches/mingw/${{ gcc_maj_ver }}/0020-libgomp-Don-t-hard-code-MS-printf-attributes.patch
          - if: gcc_maj_ver != "15"
            then: patches/mingw/${{ gcc_maj_ver }}/0021-PR14940-Allow-a-PCH-to-be-mapped-to-a-different-addr.patch
          - patches/mingw/${{ gcc_maj_ver }}/0140-gcc-diagnostic-color.patch
          - patches/mingw/${{ gcc_maj_ver }}/0200-add-m-no-align-vector-insn-option-for-i386.patch
          - if: gcc_maj_ver == "13"
            then:
              - patches/mingw/${{ gcc_maj_ver }}/0300-override-builtin-printf-format.patch
              - patches/mingw/${{ gcc_maj_ver }}/2000-enable-rust.patch
          - patches/mingw/${{ gcc_maj_ver }}/2001-fix-building-rust-on-mingw-w64.patch
          - if: gcc_maj_ver == "13"
            then:
              - patches/mingw/${{ gcc_maj_ver }}/2f7e7bfa3c6327793cdcdcb5c770b93cecd49bd0.patch
              - patches/mingw/${{ gcc_maj_ver }}/3eeb4801d6f45f6250fc77a6d3ab4e0115f8cfdd.patch
          - if: gcc_maj_ver == "15"
            then: patches/mingw/${{ gcc_maj_ver }}/9002-native-tls.patch
      # Patches from https://github.com/Homebrew/formula-patches/tree/698885df7f624d0ce15bceb79a4d9760a473b502/gcc
      # edited with `s/-Wc,-nodefaultrpaths/-nodefaultrpaths`.
      - if: cross_target_osx
        then:
          - patches/macos/gcc-${{ version }}.diff
          - if: cross_target_platform == "osx-64"
            then: patches/macos/0001-GCC-${{ gcc_maj_ver }}-Increase-fallback-min-macOS-version-for-libgc.patch
          - patches/macos/0002-Make-stdlib-libc-the-default-for-macos-platforms.patch
          - patches/macos/0003-Find-macos-sysroot-by-calling-xcrun.patch
          - patches/macos/fix-malloc-error.diff
  # Need an up-to-date zlib for recent clang.
  - url: https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
    sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
    target_directory: zlib2
  # gcc's in-tree prerequisites: declared as checksummed sources instead of
  # letting contrib/download_prerequisites fetch them, because the build
  # environment has no reliable network access. The script still verifies
  # them (sha512) and sets up the source symlinks.
  - url: https://gcc.gnu.org/pub/gcc/infrastructure/gmp-6.2.1.tar.bz2
    sha256: eae9326beb4158c386e39a356818031bd28f3124cf915f8c5b1dc4c7a36b4d7c
    file_name: gmp-6.2.1.tar.bz2
  - url: https://gcc.gnu.org/pub/gcc/infrastructure/mpfr-4.1.0.tar.bz2
    sha256: feced2d430dd5a97805fa289fed3fc8ff2b094c02d05287fd6133e7f1f0ec926
    file_name: mpfr-4.1.0.tar.bz2
  - url: https://gcc.gnu.org/pub/gcc/infrastructure/mpc-1.2.1.tar.gz
    sha256: 17503d2c395dfcf106b622dc142683c1199431d095367c6aacba6eec30340459
    file_name: mpc-1.2.1.tar.gz
  - url: https://gcc.gnu.org/pub/gcc/infrastructure/isl-0.24.tar.bz2
    sha256: fcf78dd9656c10eb8cf9fbd5f59a0b6b01386205fe1934b3b287a0a1898145c0
    file_name: isl-0.24.tar.bz2
  - if: gcc_maj_ver != "13"
    then:
      - url: https://gcc.gnu.org/pub/gcc/infrastructure/gettext-0.22.tar.gz
        sha256: 49f089be11b490170bbf09ed2f51e5f5177f55be4cc66504a5861820e0fb06ab
        file_name: gettext-0.22.tar.gz

build:
  number: ${{ build_num }}
  prefix_detection:
    ignore_binary_files: true

outputs:
  # Compile and install GCC once. Package outputs inherit this prefix and select
  # their files declaratively below.
  - staging:
      name: gcc-compilers-build
    requirements:
      build:
        - conda
      host:
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    build:
      script:
        file: build.sh
        env:
          # Unlike conda-build, rattler-build only exports variant variables
          # that this staging output itself consumes, so explicitly pass
          # through everything build.sh, setup_compiler.sh and the
          # install-*.sh scripts need.
          PKG_VERSION: ${{ version }}
          PKG_BUILDNUM: ${{ build_num }}
          # rattler-build clears the process environment before running the
          # script; forward these from the outer environment (evaluated at
          # render time in rattler-build's own process):
          # - CI gates the patch-directory pruning in build.sh
          # - CONDA_BUILD_SYSROOT becomes SDKROOT (--with-build-sysroot) on
          #   macOS build lanes
          CI: ${{ env.get("CI", default="") }}
          CONDA_BUILD_SYSROOT: ${{ env.get("CONDA_BUILD_SYSROOT", default="") }}
          TARGET: ${{ TARGET }}
          binutils_version: ${{ binutils_version }}
          c_stdlib: ${{ c_stdlib }}
          c_stdlib_version: ${{ c_stdlib_version }}
          cross_target_cxx_stdlib: ${{ cross_target_cxx_stdlib }}
          cross_target_platform: ${{ cross_target_platform }}
          cross_target_stdlib: ${{ cross_target_stdlib }}
          cross_target_stdlib_version: ${{ cross_target_stdlib_version }}
          gcc_maj_ver: ${{ gcc_maj_ver }}
          gcc_version: ${{ gcc_version }}
          libgfortran_soname: ${{ libgfortran_soname }}
          libgomp_ver: ${{ libgomp_ver }}

  - package:
      name: libgcc-devel_${{ cross_target_platform }}
    inherit: gcc-compilers-build
    build:
      skip: invalid_configuration
      number: ${{ libgcc_devel_build_num }}
      noarch: generic
      files:
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/crt*.o"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/gcov.h"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc*"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcov.a"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libd10-*"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libemutls*"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libheapt*"
      dynamic_linking:
        missing_dso_allowlist:
          - "*"
    requirements:
      host:
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
      run:
        - if: win
          then: m2-conda-epoch
          else: __unix
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    tests:
      - package_contents:
          files:
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc.a"
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_eh.a"
            - if: cross_target_osx
              then:
                - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/crtfastmath.o"
                - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.1.1.dylib"
                - if: cross_target_platform == "osx-64"
                  then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.1.dylib"
              else: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/crtbegin.o"
            - if: cross_target_win
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.a"
            - if: cross_target_linux
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.so"
    about:
      summary: The GNU C development libraries and object files
      homepage: https://gcc.gnu.org/
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: libstdcxx-devel_${{ cross_target_platform }}
    inherit: gcc-compilers-build
    build:
      number: ${{ libgcc_devel_build_num }}
      noarch: generic
      skip:
        - invalid_configuration
        - cross_target_cxx_stdlib != "libstdcxx"
      files:
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/c++/**"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++*"
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libsupc++*"
        - "${{ path_prefix }}lib/libstdc++.modules.json"
      dynamic_linking:
        missing_dso_allowlist:
          - "*"
    requirements:
      host:
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
      run:
        - if: win
          then: m2-conda-epoch
          else: __unix
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    tests:
      - package_contents:
          files:
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/c++/cstdio"
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++.a"
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++fs.a"
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libsupc++.a"
            - if: cross_target_win
              then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++.dll.a"
              else: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++.so"
    about:
      summary: The GNU C++ headers and development libraries
      homepage: https://gcc.gnu.org/
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: gcc_impl_${{ cross_target_platform }}
    inherit: gcc-compilers-build
    build:
      skip: invalid_configuration
      files:
        include:
          - "${{ path_prefix }}bin/${{ TARGET }}-c89*"
          - "${{ path_prefix }}bin/${{ TARGET }}-c99*"
          - "${{ path_prefix }}bin/${{ TARGET }}-cc*"
          - "${{ path_prefix }}bin/${{ TARGET }}-cpp*"
          - "${{ path_prefix }}bin/${{ TARGET }}-gcc*"
          - "${{ path_prefix }}bin/${{ TARGET }}-gcov*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/**"
          - "${{ path_prefix }}lib/libcc1*"
          - "${{ path_prefix }}libexec/gcc/${{ TARGET }}/${{ gcc_version }}/**"
          - "${{ path_prefix }}share/info/*.info"
          - "${{ path_prefix }}share/licenses/gcc/**"
          - "${{ path_prefix }}share/man/**"
        exclude:
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/conda.specs"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/crt*.o"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/c++/**"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/gcov.h"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/include/ISO_Fortran_binding.h"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/finclude/ieee_*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libd10-*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libemutls*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcov.a"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgfortran*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libheapt*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libstdc++*"
          - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libsupc++*"
          - "${{ path_prefix }}libexec/gcc/${{ TARGET }}/${{ gcc_version }}/cc1plus*"
          - "${{ path_prefix }}libexec/gcc/${{ TARGET }}/${{ gcc_version }}/f951*"
          # in gfortran_impl (the gfortran man page, in contrast, stays in
          # share/man/** above: gcc's install-man installs the man pages of
          # all enabled languages)
          - "${{ path_prefix }}share/info/gfortran.info"
          # in libgcc
          - "${{ path_prefix }}share/info/libgomp.info"
          - "${{ path_prefix }}share/info/libquadmath.info"
      dynamic_linking:
        missing_dso_allowlist:
          - "*"
    requirements:
      host:
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
        - if: target_platform == cross_target_platform
          then:
            - if: not cross_target_osx
              then:
                - ${{ pin_subpackage("libgomp", exact=True) }}
                - ${{ pin_subpackage("libstdcxx", exact=True) }}
            - ${{ pin_subpackage("libgcc", exact=True) }}
            - ${{ pin_subpackage("libgfortran" ~ libgfortran_soname) }}
            - if: not (win or osx)
              then: ${{ pin_subpackage("libsanitizer", exact=True) }}
        - ${{ pin_subpackage("libgcc-devel_" ~ cross_target_platform, exact=True) }}
      run:
        - if: cross_target_osx
          then:
            - ld64_${{ cross_target_platform }}
            - cctools_${{ cross_target_platform }}
            - clang
          else:
            - binutils_impl_${{ cross_target_platform }} >=${{ binutils_version }}
            - if: cross_target_stdlib != "None"
              then: ${{ cross_target_stdlib }}_${{ cross_target_platform }}
            - if: target_platform == cross_target_platform
              then:
                - ${{ pin_subpackage("libstdcxx", upper_bound=None) }}
                - ${{ pin_subpackage("libgomp", upper_bound=None) }}
            - ${{ pin_subpackage("libstdcxx-devel_" ~ cross_target_platform, exact=True) }}
        - ${{ pin_subpackage("libgcc-devel_" ~ cross_target_platform, exact=True) }}
        - if: target_platform == cross_target_platform
          then:
            - if: not (win or osx)
              then: ${{ pin_subpackage("libsanitizer", exact=True) }}
            - ${{ pin_subpackage("libgcc", upper_bound=None) }}
      run_exports:
        strong:
          - libgcc >=${{ gcc_version }}
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    tests:
      - package_contents:
          bin:
            - ${{ TARGET }}-cpp
            - ${{ TARGET }}-gcc
          files:
            exists:
              - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgomp.spec"
              - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgomp.*"
              # only assert libquadmath for win, matching the old test (it
              # is not built at all for aarch64/riscv64 targets)
              - if: cross_target_win
                then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libquadmath.*"
              # only for native linux: on win the shared library is a dll in
              # bin/ (the old test asserted this for win too, but conda-build
              # never ran tests for the cross-compiled win packages)
              - if: target_platform == cross_target_platform and cross_target_linux
                then: "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgomp.so"
              - if: cross_target_linux
                then:
                  - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libsanitizer.spec"
                  - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/libasan_preinit.o"
            not_exists:
              - if: not cross_target_osx
                then:
                  - "${{ path_prefix }}bin/gcc"
                  - "${{ path_prefix }}bin/cpp"
      - files:
          recipe:
            - tests/**
        requirements:
          run:
            - if: cross_target_stdlib != "None"
              then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
        script:
          env:
            # the darwin cross compilers locate the macOS SDK through
            # CONDA_BUILD_SYSROOT; rattler-build's cleared test environment
            # does not inherit it from CI (conda-build's did)
            CONDA_BUILD_SYSROOT: ${{ env.get("CONDA_BUILD_SYSROOT", default="") }}
          content:
            - echo ${{ c_stdlib }}
            - echo ${{ c_stdlib_version }}
            - if: target_platform == cross_target_platform and cross_target_linux
              then: test `readlink ${PREFIX}/lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgomp.so` == "../../../libgomp.so"
            - CC=$(${PREFIX}/bin/*-gcc -dumpmachine)-gcc
            - if: target_platform == cross_target_platform and (x86_64 or s390x)
              then: ${CC} -Wall tests/aligned_alloc.c -c -o c_aligned.o -v -Wl,-v -march=native
            - if: target_platform == cross_target_platform and (not x86_64 and not s390x and not ppc64le and not riscv64)
              then: ${CC} -Wall tests/aligned_alloc.c -c -o c_aligned.o -v -Wl,-v -mcpu=native
            - if: not cross_target_win
              then:
                - ${CC} -Wall tests/aligned_alloc.c -c -o c_aligned.o -v -fsanitize=address
                - ${CC} -Wall tests/aligned_alloc.c -c -o c_aligned.o -v
            - if: cross_target_platform == target_platform and not cross_target_win
              then: ${CC} -Wall c_aligned.o -o c_aligned -v && ./c_aligned
            - if: cross_target_platform == target_platform and linux
              then: ${CC} -Wall c_aligned.o -o c_aligned -Wl,-rpath,/foo && ${{ TARGET }}-readelf -d c_aligned | grep RPATH | grep "/foo:${PREFIX}/lib"
            - ${CC} -Wall tests/hello_world.c -c -o hello_world.o -v
            - ${CC} -Wall hello_world.o -o hello_world -v
            - if: cross_target_linux
              then: test -f ${PREFIX}/lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.so
            - if: cross_target_osx
              then:
                - test -f ${PREFIX}/lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.1.1.dylib
                - find ${PREFIX}/${{ TARGET }} || true
                - test ! -d ${PREFIX}/${{ TARGET }}
            - if: cross_target_win
              then: test -f ${PREFIX}/lib/gcc/${{ TARGET }}/${{ gcc_version }}/libgcc_s.a
    about:
      summary: GNU C Compiler
      homepage: https://gcc.gnu.org/
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: gcc
    inherit: gcc-compilers-build
    build:
      skip:
        - invalid_configuration
        - target_platform != cross_target_platform
      variant:
        down_prioritize_variant: ${{ 1 if not with_conda_specs else 0 }}
      files:
        - "${{ path_prefix }}bin/gcc*"
        - "${{ path_prefix }}bin/gcov*"
        - "${{ path_prefix }}bin/cc*"
        - "${{ path_prefix }}bin/cpp*"
    requirements:
      host:
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, exact=True) }}
        - if: not cross_target_osx
          then: binutils_impl_${{ cross_target_platform }} ${{ binutils_version }}.* bootstrap_*
      run:
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, exact=True) }}
        - if: with_conda_specs
          then: conda-gcc-specs
    tests:
      - package_contents:
          bin:
            - gcc
            - gcov
      - script:
          - echo "int main (void) {return 0;}" > conftest.c
          - ${PREFIX}/bin/gcc -v
          - ${PREFIX}/bin/gcc conftest.c -c -v
          - ${PREFIX}/bin/gcov -v
    about:
      summary: GNU C native compiler (symlinks)
      homepage: https://github.com/conda-forge/ctng-compilers-feedstock
      license: BSD-3-Clause
      license_file: LICENSE

  - package:
      name: gcc-no-conda-specs
    inherit: gcc-compilers-build
    build:
      skip:
        - invalid_configuration
        - with_conda_specs
        - target_platform != cross_target_platform
      files:
        exclude:
          - "**"
    requirements:
      run:
        - ${{ pin_subpackage("gcc", exact=True) }}
      run_constraints:
        - conda-gcc-specs <0.0a0
    tests:
      - package_contents:
          strict: true
      - script:
          - gcc --version

  - package:
      name: conda-gcc-specs
    inherit: gcc-compilers-build
    build:
      skip:
        - invalid_configuration
        - cross_target_platform != target_platform
      files:
        - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/conda.specs"
    requirements:
      run:
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, upper_bound="x.x.x.x") }}
    tests:
      - package_contents:
          files:
            - "${{ path_prefix }}lib/gcc/${{ TARGET }}/${{ gcc_version }}/conda.specs"
      - files:
          recipe:
            - tests/**
        script:
          - specdir=$PREFIX/lib/gcc/${{ TARGET }}/${{ gcc_version }}
          - CC=$(${PREFIX}/bin/*-gcc -dumpmachine)-gcc
          - if: linux
            then: echo | ${CC} -E -v -x c - |& grep '^Reading specs from' | awk '{print $NF}' | xargs readlink -e | awk -v ORS= '{print $1":"}' | grep "${specdir}/specs:${specdir}/conda.specs:"
          - cp tests/libhowdy.h $PREFIX/include/
          - ${CC} -shared -fpic -o $PREFIX/lib/libhowdy.so tests/libhowdy.c
          - ${CC} -o howdy-dso tests/howdy-dso.c -lhowdy
          - ./howdy-dso
          - if: linux
            then:
              - grep RPATH <(${{ TARGET }}-readelf -d howdy-dso)
              - "! grep RUNPATH <(${{ TARGET }}-readelf -d howdy-dso)"
              - ${CC} -Wl,-enable-new-dtags -o howdy-dso-runpath tests/howdy-dso.c -lhowdy
              - ./howdy-dso-runpath
              - "! grep RPATH <(${{ TARGET }}-readelf -d howdy-dso-runpath)"
              - grep RUNPATH <(${{ TARGET }}-readelf -d howdy-dso-runpath)
              - echo | ${CC} -E -Wp,-v -x c - |& awk '/include <\.\.\.> search starts/,/^End of search/ {print}' | tail -n2 | head -n1 | grep "$PREFIX/include"
              - echo | ${CC} -isystem "$PREFIX/include" -E -Wp,-v -x c - |& awk '/include <\.\.\.> search starts/, /^End of search/ {print}' | head -n2 | tail -n1 | grep "$PREFIX/include"
    about:
      summary: conda-specific specfile for GNU C/C++ Compiler
      description: |
        When installed, this optional package provides a specfile that
        directs gcc (and g++ or gfortran) to automatically:
          * search for includes in $PREFIX/include
          * link libraries in $PREFIX/lib
          * set RPATH to $PREFIX/lib
          * use RPATH instead of the newer RUNPATH
        This package is intended to aid usability of the compiler
        toolchain as a replacement for system-installed compilers.
        It should not be used in recipes. Use the 'compiler(<lang>)'
        jinja function as described in the conda-forge maintainer docs.
      homepage: https://gcc.gnu.org/
      documentation: https://gcc.gnu.org/onlinedocs/gcc/Spec-Files.html
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: gxx_impl_${{ cross_target_platform }}
    inherit: gcc-compilers-build
    build:
      skip: invalid_configuration
      files:
        - "${{ path_prefix }}bin/${{ TARGET }}-c++*"
        - "${{ path_prefix }}bin/${{ TARGET }}-g++*"
        # the gdb pretty-printer hook lands in the target toolexeclib
        # directory: lib/ for native builds, <triplet>/lib/ for cross builds
        - "${{ path_prefix }}lib/*-gdb.py"
        - "${{ path_prefix }}${{ TARGET }}/lib/*-gdb.py"
        - "${{ path_prefix }}libexec/gcc/${{ TARGET }}/${{ gcc_version }}/cc1plus*"
        - "${{ path_prefix }}share/gcc-${{ gcc_version }}/**"
      dynamic_linking:
        missing_dso_allowlist:
          - "*"
    requirements:
      host:
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, exact=True) }}
        - if: not cross_target_osx
          then: binutils_impl_${{ cross_target_platform }} ${{ binutils_version }}.* bootstrap_*
        - if: cross_target_cxx_stdlib == "libstdcxx"
          then: ${{ pin_subpackage("libstdcxx-devel_" ~ cross_target_platform, exact=True) }}
      run:
        - ${{ pin_subpackage("gcc_impl_" ~ cross_target_platform, exact=True) }}
        - if: cross_target_stdlib != "None"
          then: ${{ cross_target_stdlib }}_${{ cross_target_platform }}
        - if: cross_target_cxx_stdlib == "libstdcxx"
          then: ${{ pin_subpackage("libstdcxx-devel_" ~ cross_target_platform, exact=True) }}
        - if: cross_target_cxx_stdlib == "libcxx"
          then:
            - if: target_platform == cross_target_platform
              then: libcxx-devel
              else: libcxx-headers
        - tzdata
      run_exports:
        strong:
          - if: cross_target_cxx_stdlib == "libstdcxx"
            then: libstdcxx >=${{ gcc_version }}
          - if: cross_target_cxx_stdlib == "libcxx"
            then: libcxx
      ignore_run_exports:
        from_package:
          - ${{ cross_target_stdlib }}_${{ cross_target_platform }}
    tests:
      - package_contents:
          bin:
            - ${{ TARGET }}-g++
      - files:
          recipe:
            - tests/**
        requirements:
          run:
            - if: cross_target_stdlib != "None"
              then: ${{ cross_target_stdlib }}_${{ cross_target_platform }} ${{ cross_target_stdlib_version }}.*
        script:
          env:
            # the darwin cross compilers locate the macOS SDK through
            # CONDA_BUILD_SYSROOT; rattler-build's cleared test environment
            # does not inherit it from CI (conda-build's did)
            CONDA_BUILD_SYSROOT: ${{ env.get("CONDA_BUILD_SYSROOT", default="") }}
          content:
            - CXX=$(${PREFIX}/bin/*-gcc -dumpmachine)-g++
            - if: not cross_target_win
              then: ${CXX} -Wall tests/aligned_alloc.cpp -c -o cpp_aligned.o --std=c++17
            - if: cross_target_platform == target_platform and not cross_target_win
              then: ${CXX} -Wall cpp_aligned.o -o cpp_aligned --std=c++17 && ./cpp_aligned
            - ${CXX} -Wall tests/hello_world.cpp -c -o hello_world.o --std=c++17 -v
            - ${CXX} -Wall hello_world.o -o hello_world --std=c++17 -v
            # test tzdb integration
            - if: match(gcc_maj_ver, ">=14") and cross_target_cxx_stdlib == "libstdcxx"
              then:
                - ${CXX} -isystem ${PREFIX}/include --std=c++20 -Wall tests/tzdb-override.cpp -c -o tzdb-override.o -v
                - ${CXX} -isystem ${PREFIX}/include --std=c++20 -Wall tests/tzdb.cpp -c -o tzdb.o -v
                - if: target_platform == cross_target_platform
                  then:
                    - ${CXX} tzdb-override.o -o tzdb-override -v && ./tzdb-override
                    - ${CXX} tzdb.o -o tzdb -v && ./tzdb
                    - strace ./tzdb 2>&1 | grep ${CONDA_PREFIX}/lib/../share/zoneinfo/tzdata.zi
                    # also test without any environment activation
                    - unset PREFIX
                    - unset CONDA_PREFIX
                    - ./tzdb
    about:
      summary: GNU C++ Compiler
      homepage: https://gcc.gnu.org/
      license: GPL-3.0-only WITH GCC-exception-3.1

  - package:
      name: gxx
    inherit: gcc-compilers-build
    build:
      skip:
        - invalid_configuration
        - target_platform != cross_target_platform
      files:
        - "${{ path_prefix }}bin/g++*"
        - "${{ path_prefix }}bin/c++*"
    requirements:
      host:
        - ${{ pin_subpackage("gxx_impl_" ~ cross_target_platform, exact=True) }}
        - if: not cross_target_osx
